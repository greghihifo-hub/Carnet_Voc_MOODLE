<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnet de Vocabulaire B1 Intelligent</title>
    <!-- Chargement de Tailwind CSS pour un style moderne et mobile-first -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuration de la police Inter -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
            min-height: 100vh;
        }
        .card {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }
        .btn-primary {
            background-color: #006497; /* MoodleBlue */
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #004f77;
        }
        /* Style pour l'indicateur de chargement/réussite */
        .loading-ring {
            display: inline-block;
            width: 1.25rem;
            height: 1.25rem;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Carnet de Vocabulaire B1</h1>
            <p class="text-lg text-gray-600">Ajoutez, révisez et suivez vos mots pour le niveau intermédiaire.</p>
            <!-- Affichage de l'état d'authentification et de l'ID utilisateur pour le débogage/traçabilité -->
            <p id="auth-status" class="text-xs mt-2 text-gray-500 font-semibold">Connexion en cours...</p>
        </header>

        <!-- Formulaire d'ajout de mot -->
        <div class="card bg-white p-6 rounded-lg mb-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Ajouter un nouveau mot</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="frenchWord" placeholder="Mot français (ex: déboucher)" class="p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                <input type="text" id="translation" placeholder="Traduction (ex: to unblock)" class="p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                <input type="text" id="example" placeholder="Phrase d'exemple (Optionnel)" class="p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            </div>
            <button id="addWordBtn" class="btn-primary text-white font-bold py-3 px-6 rounded-lg w-full mt-4 hover:shadow-md transition duration-150" aria-label="Ajouter le mot au carnet" disabled>
                <span id="addWordText">Ajouter à mon carnet</span>
                <span id="addWordLoading" class="loading-ring hidden"></span>
            </button>
            <div id="message-box" class="mt-4 text-center text-sm hidden"></div>
        </div>

        <!-- Section de Révision Rapide (Quiz) -->
        <div class="card bg-white p-6 rounded-lg mb-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4 flex justify-between items-center">
                Révision Rapide
                <button id="startQuizBtn" class="bg-green-500 text-white text-sm font-semibold py-1 px-4 rounded-full hover:bg-green-600 transition duration-150" aria-label="Démarrer la session de quiz" disabled>
                    Démarrer le Quiz
                </button>
            </h2>
            <div id="quiz-area" class="text-center mt-4">
                <p id="quiz-message" class="text-gray-500">En attente de chargement des mots...</p>
                <div id="quiz-question" class="hidden">
                    <p class="text-2xl font-bold text-gray-800 mb-3" id="current-word">Mot en français</p>
                    <input type="text" id="quiz-answer" placeholder="Votre traduction..." class="p-3 border border-gray-300 rounded-lg w-full max-w-sm text-center focus:ring-green-500 focus:border-green-500 mx-auto block mb-3">
                    <button id="submitAnswerBtn" class="bg-gray-500 text-white font-semibold py-2 px-6 rounded-lg hover:bg-gray-600 transition duration-150" aria-label="Vérifier la réponse">
                        Vérifier
                    </button>
                    <p id="feedback" class="mt-2 font-semibold"></p>
                </div>
            </div>
        </div>

        <!-- Liste du Vocabulaire -->
        <div class="card bg-white p-6 rounded-lg">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Mon Vocabulaire (Taux d'Erreur)</h2>
            <div id="wordList" class="space-y-3">
                <p id="loading-message" class="text-gray-500 text-center">Chargement de votre carnet...</p>
            </div>
        </div>
    </div>

    <!-- Firebase Imports et Logique -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, doc, collection, query, onSnapshot, 
            addDoc, updateDoc, deleteDoc, setLogLevel, getDocs 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // --- Variables globales fournies par Canvas (MANDATORY USE) ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // --- Variables de l'application ---
        let db = null;
        let auth = null;
        let currentUserId = null;
        let words = []; 
        let quizWord = null;
        
        // --- Références DOM ---
        const authStatusP = document.getElementById('auth-status');
        const frenchWordInput = document.getElementById('frenchWord');
        const translationInput = document.getElementById('translation');
        const exampleInput = document.getElementById('example');
        const addWordBtn = document.getElementById('addWordBtn');
        const addWordText = document.getElementById('addWordText');
        const addWordLoading = document.getElementById('addWordLoading');
        const wordListDiv = document.getElementById('wordList');
        const messageBox = document.getElementById('message-box');
        const startQuizBtn = document.getElementById('startQuizBtn');
        const quizMessageP = document.getElementById('quiz-message');
        const quizQuestionDiv = document.getElementById('quiz-question');
        const currentWordP = document.getElementById('current-word');
        const quizAnswerInput = document.getElementById('quiz-answer');
        const submitAnswerBtn = document.getElementById('submitAnswerBtn');
        const feedbackP = document.getElementById('feedback');

        // --- Fonctions utilitaires ---
        function displayMessage(text, isError = false) {
            messageBox.textContent = text;
            messageBox.className = `mt-4 p-3 rounded-lg text-sm ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            messageBox.classList.remove('hidden');
            setTimeout(() => messageBox.classList.add('hidden'), 3000);
        }

        function setAddButtonState(isLoading) {
            addWordBtn.disabled = isLoading;
            if (isLoading) {
                addWordText.classList.add('hidden');
                addWordLoading.classList.remove('hidden');
            } else {
                addWordText.classList.remove('hidden');
                addWordLoading.classList.add('hidden');
            }
        }

        // --- Rendu de l'interface utilisateur ---
        function renderWordList() {
            if (!words || words.length === 0) {
                wordListDiv.innerHTML = '<p class="text-center py-4 text-gray-500">Votre carnet est vide. Ajoutez un premier mot !</p>';
                startQuizBtn.disabled = true;
                return;
            }
            startQuizBtn.disabled = false;
            quizMessageP.textContent = "Cliquez sur \"Démarrer le Quiz\" pour commencer. Le quiz priorise les mots que vous ratez le plus.";


            // Trier par taux d'erreur décroissant (les mots avec le plus d'erreurs en premier)
            const sortedWords = [...words].sort((a, b) => {
                const totalAttemptsA = (a.correctCount || 0) + (a.incorrectCount || 0);
                const totalAttemptsB = (b.correctCount || 0) + (b.incorrectCount || 0);
                const errorRateA = (a.incorrectCount || 0) / Math.max(1, totalAttemptsA);
                const errorRateB = (b.incorrectCount || 0) / Math.max(1, totalAttemptsB);
                return errorRateB - errorRateA;
            });

            let html = '';
            sortedWords.forEach((word) => {
                const totalAttempts = (word.correctCount || 0) + (word.incorrectCount || 0);
                const errorRate = totalAttempts > 0 ? ((word.incorrectCount || 0) / totalAttempts * 100).toFixed(0) : 0;
                const errorColor = errorRate > 50 ? 'bg-red-100 border-red-300' : errorRate > 0 ? 'bg-yellow-100 border-yellow-300' : 'bg-green-100 border-green-300';

                html += `
                    <div class="flex items-center p-3 border rounded-lg ${errorColor}">
                        <div class="flex-grow">
                            <p class="font-semibold text-gray-800">${word.frenchWord}</p>
                            <p class="text-sm text-gray-600">${word.translation}</p>
                            ${word.example ? `<p class="text-xs text-gray-500 italic truncate max-w-full">Ex: ${word.example}</p>` : ''}
                        </div>
                        <div class="text-right ml-4 w-20 flex-shrink-0">
                            <span class="text-lg font-bold ${errorRate > 0 ? 'text-red-700' : 'text-green-700'}">${errorRate}%</span>
                            <p class="text-xs text-gray-500">(${word.incorrectCount || 0} erreurs)</p>
                        </div>
                        <button data-id="${word.id}" class="delete-btn ml-4 text-red-500 hover:text-red-700 transition duration-150 flex-shrink-0" title="Supprimer le mot" aria-label="Supprimer le mot ${word.frenchWord}">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 100 2v6a1 1 0 100-2V8z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </div>
                `;
            });

            wordListDiv.innerHTML = html;
            attachDeleteListeners();
        }

        // --- Logique Firestore ---

        function getCollectionPath() {
            // Chemin privé: /artifacts/{appId}/users/{userId}/vocabulary
            if (!currentUserId) throw new Error("Utilisateur non authentifié.");
            return `artifacts/${appId}/users/${currentUserId}/vocabulary`;
        }

        function setupRealtimeListener() {
            if (!db || !currentUserId) return;

            const path = getCollectionPath();
            const q = collection(db, path);

            // onSnapshot écoute les changements en temps réel
            onSnapshot(q, (querySnapshot) => {
                words = [];
                querySnapshot.forEach((doc) => {
                    // S'assurer que les compteurs sont des nombres, même s'ils sont manquants
                    const data = doc.data();
                    words.push({
                        id: doc.id,
                        frenchWord: data.frenchWord || '',
                        translation: data.translation || '',
                        example: data.example || '',
                        correctCount: data.correctCount || 0,
                        incorrectCount: data.incorrectCount || 0,
                    });
                });
                console.log(`Chargement réussi : ${words.length} mots.`);
                document.getElementById('loading-message').textContent = "";
                renderWordList();
            }, (error) => {
                console.error("Erreur lors de l'écoute Firestore: ", error);
                document.getElementById('loading-message').textContent = "Erreur de chargement des données. Vérifiez l'authentification et les règles de sécurité Firebase.";
            });
        }

        async function addWordToFirestore(frenchWord, translation, example) {
            if (!currentUserId) return displayMessage("Erreur : Non connecté. Impossible d'ajouter le mot.", true);
            setAddButtonState(true);
            
            if (!frenchWord || !translation) {
                setAddButtonState(false);
                return displayMessage("Veuillez remplir le mot français et la traduction.", true);
            }

            try {
                const path = getCollectionPath();
                await addDoc(collection(db, path), {
                    frenchWord: frenchWord.trim(),
                    translation: translation.trim(),
                    example: example.trim(),
                    correctCount: 0,
                    incorrectCount: 0,
                    createdAt: new Date().toISOString()
                });
                
                displayMessage("Mot ajouté avec succès !");
                frenchWordInput.value = '';
                translationInput.value = '';
                exampleInput.value = '';

            } catch (e) {
                console.error("Erreur lors de l'ajout du mot: ", e);
                displayMessage("Erreur serveur lors de l'ajout.", true);
            } finally {
                setAddButtonState(false);
            }
        }
        
        async function updateWordCountsInFirestore(wordId, isCorrect) {
            if (!currentUserId) return;
            
            try {
                const wordRef = doc(db, getCollectionPath(), wordId);
                const word = words.find(w => w.id === wordId);

                if (!word) {
                    console.error("Mot non trouvé pour la mise à jour.");
                    return;
                }
                
                const updateData = {};
                if (isCorrect) {
                    updateData.correctCount = (word.correctCount || 0) + 1;
                } else {
                    updateData.incorrectCount = (word.incorrectCount || 0) + 1;
                }
                
                await updateDoc(wordRef, updateData);
                
            } catch (e) {
                console.error("Erreur lors de la mise à jour des compteurs: ", e);
            }
        }
        
        async function deleteWordFromFirestore(wordId) {
            if (!currentUserId) return;
            try {
                await deleteDoc(doc(db, getCollectionPath(), wordId));
                displayMessage("Mot supprimé avec succès.");
            } catch (e) {
                console.error("Erreur lors de la suppression du mot: ", e);
                displayMessage("Erreur serveur lors de la suppression.", true);
            }
        }

        function attachDeleteListeners() {
            document.querySelectorAll('.delete-btn').forEach(button => {
                button.onclick = (e) => {
                    const wordId = e.currentTarget.getAttribute('data-id');
                    if (wordId && currentUserId) {
                        deleteWordFromFirestore(wordId);
                    } else if (!currentUserId) {
                        displayMessage("Veuillez vous authentifier pour effectuer des actions.", true);
                    }
                };
            });
        }

        // --- Logique du Quiz ---
        function startQuiz() {
            if (words.length === 0 || startQuizBtn.disabled) return;

            // Trier par taux d'erreur décroissant (le plus d'erreurs en premier)
            const sortedForQuiz = [...words].sort((a, b) => {
                const totalAttemptsA = (a.correctCount || 0) + (a.incorrectCount || 0);
                const totalAttemptsB = (b.correctCount || 0) + (b.incorrectCount || 0);
                const errorRateA = (a.incorrectCount || 0) / Math.max(1, totalAttemptsA);
                const errorRateB = (b.incorrectCount || 0) / Math.max(1, totalAttemptsB);
                return errorRateB - errorRateA;
            });
            
            // Choisir le mot avec le taux d'erreur le plus élevé
            quizWord = sortedForQuiz[0];

            if (!quizWord) {
                quizMessageP.textContent = "Erreur: Impossible de sélectionner un mot pour le quiz.";
                return;
            }

            quizMessageP.classList.add('hidden');
            quizQuestionDiv.classList.remove('hidden');
            currentWordP.textContent = quizWord.frenchWord;
            quizAnswerInput.value = '';
            feedbackP.textContent = '';
            submitAnswerBtn.textContent = 'Vérifier';
            submitAnswerBtn.classList.remove('bg-green-500', 'bg-red-500');
            submitAnswerBtn.classList.add('bg-gray-500');
            
            quizAnswerInput.focus();
        }

        function checkAnswer() {
            if (!quizWord) return;

            const userAnswer = quizAnswerInput.value.trim().toLowerCase();
            const correctTranslation = quizWord.translation.trim().toLowerCase();
            const isSubmit = submitAnswerBtn.textContent === 'Vérifier';

            if (isSubmit) {
                const isCorrect = userAnswer === correctTranslation;
                
                // Mettre à jour Firestore
                updateWordCountsInFirestore(quizWord.id, isCorrect);

                if (isCorrect) {
                    feedbackP.textContent = "Correct ! 🎉";
                    feedbackP.className = 'mt-2 font-semibold text-green-700';
                    submitAnswerBtn.classList.remove('bg-gray-500');
                    submitAnswerBtn.classList.add('bg-green-500');
                } else {
                    feedbackP.textContent = `Faux. La réponse correcte était : ${quizWord.translation} ${quizWord.example ? `(Ex: ${quizWord.example})` : ''}`;
                    feedbackP.className = 'mt-2 font-semibold text-red-700';
                    submitAnswerBtn.classList.remove('bg-gray-500');
                    submitAnswerBtn.classList.add('bg-red-500');
                }
                
                submitAnswerBtn.textContent = 'Mot Suivant';
                
            } else {
                submitAnswerBtn.textContent = 'Vérifier';
                submitAnswerBtn.classList.remove('bg-green-500', 'bg-red-500');
                submitAnswerBtn.classList.add('bg-gray-500');
                startQuiz(); // Passer au mot suivant
            }
        }

        // --- Initialisation de l'application ---

        async function initApp() {
            // Afficher le statut initial
            authStatusP.textContent = "Initialisation de Firebase...";
            setLogLevel('debug'); // Pour le débogage

            // 1. Initialiser Firebase
            if (!firebaseConfig || Object.keys(firebaseConfig).length === 0) {
                 authStatusP.textContent = "Erreur: Configuration Firebase manquante. L'application ne peut pas se connecter.";
                 return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                // 2. Tenter l'authentification
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                
            } catch (e) {
                console.error("Erreur critique lors de l'initialisation Firebase/Auth:", e);
                authStatusP.textContent = "Erreur: Échec de l'authentification Firebase. Les données ne seront pas sauvegardées.";
                return;
            }

            // 3. Écouter les changements d'état d'authentification
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUserId = user.uid;
                    authStatusP.textContent = `Connecté (ID utilisateur: ${user.uid}). Les données sont sauvegardées.`;
                    addWordBtn.disabled = false;
                    setupRealtimeListener(); // Démarrer l'écoute Firestore
                } else {
                    currentUserId = null;
                    authStatusP.textContent = "Non connecté. Les données ne seront pas enregistrées. Les mots ne peuvent être ajoutés.";
                    wordListDiv.innerHTML = '<p class="text-center py-4 text-gray-500">Veuillez vous authentifier pour voir votre carnet.</p>';
                    addWordBtn.disabled = true;
                }
            });

            // 4. Événements
            addWordBtn.addEventListener('click', () => {
                addWordToFirestore(frenchWordInput.value, translationInput.value, exampleInput.value);
            });
            
            startQuizBtn.addEventListener('click', startQuiz);
            submitAnswerBtn.addEventListener('click', checkAnswer);

            // Permettre d'appuyer sur Entrée pour soumettre la réponse du quiz
            quizAnswerInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    checkAnswer();
                }
            });
        }

        initApp();

    </script>
</body>
</html>
